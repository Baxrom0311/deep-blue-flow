<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <!-- Ultra premium glassmorphic background -->
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconFluid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#64748b" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Base filled background -->
  <rect width="100%" height="100%" fill="url(#bgBase)" />
  
  <!-- Subtle Grid texture -->
  <rect width="100%" height="100%" fill="url(#dotGrid)" />

  <g transform="translate(400, 270)" text-anchor="middle">
    
    <!-- Outer glassmorphic glowing circle -->
    <circle cx="0" cy="-40" r="110" fill="url(#glowCircle)" filter="url(#softShadow)" />
    <!-- Inner accent ring -->
    <circle cx="0" cy="-40" r="85" fill="none" stroke="url(#iconFluid)" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.4" />
    
    <!-- Elegant minimal landscape/image icon inside the circle -->
    <g transform="translate(0, -40)">
      <rect x="-35" y="-30" width="70" height="56" rx="8" fill="none" stroke="url(#iconFluid)" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="-12" cy="-10" r="6" fill="url(#iconFluid)" opacity="0.8" />
      <path d="M -35 15 L -10 -5 L 15 15 L 25 5 L 35 15" fill="none" stroke="url(#iconFluid)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(0, 50)">
      <text 
        y="60" 
        font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" 
        font-weight="700" 
        font-size="34" 
        fill="#334155" 
        letter-spacing="5"
      >
        ECO COMPANY
      </text>
      
      <!-- Subtitle Typography -->
      <text 
        y="95" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="500" 
        font-size="16" 
        fill="#64748b" 
        letter-spacing="3"
        text-transform="uppercase"
      >
        Tasvir mavjud emas
      </text>
      
      <!-- Decorative separator line -->
      <line x1="-40" y1="120" x2="40" y2="120" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>